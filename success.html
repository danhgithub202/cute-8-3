<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy 8/3 ✨</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="floating-hearts" id="hearts"></div>

  <main class="page-shell">
    <section class="card success-card">
      <span class="badge">HAPPY 8/3 ✨</span>

      <img
        src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif"
        alt="Gif vui"
        class="success-gif"
      />

      <h2 class="success-title">Tâm iu dấu 💙</h2>

      <p class="success-text">
        Chúc Tâm một ngày 8/3 thật vui,<br />
        luôn xinh đẹp, hạnh phúc và ngập tràn tiếng cười.<br />
        Cảm ơn em vì đã làm cho cuộc sống của anh trở nên dễ thương hơn rất nhiều 💙🌸
      </p>

      <div class="success-actions">
        <button id="playGameBtn" class="btn btn-primary" type="button">
          Chơi game tình yêu 🎮
        </button>

        <button id="backHomeBtn" class="btn btn-secondary" type="button">
          Về lại trang đầu
        </button>
      </div>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
