<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy 8/3 ✨</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="floating-hearts" id="hearts"></div>

  <main class="page-shell">
    <section class="card success-card">
      <span class="badge">HAPPY 8/3 ✨</span>

      <img
        src="https://media4.giphy.com/media/v1.Y2lkPTZjMDliOTUyZ3o0Z3l6a2d1a3RudHI0dzFpcmJ3b3F0Y2NkNnRjdjdycHRrMnZtYyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/W1hd3uXRIbddu/giphy.gif"
        alt="Gif vui"
        class="success-gif"
      />

      <h2 class="success-title">Tâm iu dấu 💙</h2>

      <p class="success-text">
       <b>Chúc Tâm một ngày 8/3 thật thật vui</b> 🌸 <br>
      Luôn xinh đẹp, luôn rạng rỡ và luôn mỉm cười như bây giờ.  

      Cảm ơn em vì đã xuất hiện trong cuộc sống của anh. 
      Ở bên em, mọi thứ đều trở nên dễ thương hơn rất nhiều 💙
      </p>

      <div class="success-actions">
        <button id="playGameBtn" class="btn btn-primary" type="button">
          Chơi game tình yêu 🎮
        </button>

        <button id="backHomeBtn" class="btn btn-secondary" type="button">
          Về lại trang đầu
        </button>
      </div>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
