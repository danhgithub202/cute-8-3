<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phần thưởng của em 🎁</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="reward-page">

  <div class="floating-hearts" id="hearts"></div>

  <!-- 1 GIF dùng cho 4 góc màn hình -->
  <img
    src="https://media1.giphy.com/media/v1.Y2lkPTZjMDliOTUyMnpqeTkweHF2bzMyYnY3aTg0cDVhY2I2dTNnajcyd3N0djNtazd3MyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/beorHuw3tM7tcAFB0v/giphy.gif"
    class="corner-gif gif-top-left"
    alt=""
  />

  <img
    src="https://media1.giphy.com/media/v1.Y2lkPTZjMDliOTUyMnpqeTkweHF2bzMyYnY3aTg0cDVhY2I2dTNnajcyd3N0djNtazd3MyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/beorHuw3tM7tcAFB0v/giphy.gif"
    class="corner-gif gif-top-right"
    alt=""
  />

  <img
    src="https://media1.giphy.com/media/v1.Y2lkPTZjMDliOTUyMnpqeTkweHF2bzMyYnY3aTg0cDVhY2I2dTNnajcyd3N0djNtazd3MyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/beorHuw3tM7tcAFB0v/giphy.gif"
    class="corner-gif gif-bottom-left"
    alt=""
  />

  <img
    src="https://media1.giphy.com/media/v1.Y2lkPTZjMDliOTUyMnpqeTkweHF2bzMyYnY3aTg0cDVhY2I2dTNnajcyd3N0djNtazd3MyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/beorHuw3tM7tcAFB0v/giphy.gif"
    class="corner-gif gif-bottom-right"
    alt=""
  />

  <main class="page-shell reward-shell">
    <section class="card reward-card">
      <span class="badge">Phần thưởng của em 🎁</span>

      <img
        src="reward-photo.jpg"
        alt="Ảnh kỷ niệm"
        class="reward-photo"
      />

      <h2 class="reward-title">1600 ngày đang yêu 💖</h2>

      <p class="reward-text">
        Cảm ơn em đã ở bên anh suốt chặng đường này.
      </p>

      <div class="success-actions">
        <button id="playAgainBtn" class="btn btn-primary" type="button">
          Chơi lại từ đầu
        </button>

        <button id="backGameBtn" class="btn btn-secondary" type="button">
          Quay lại game
        </button>
      </div>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
