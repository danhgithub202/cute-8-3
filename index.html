<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8/3 dành cho em 🌷</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="floating-hearts" id="hearts"></div>

  <section class="page-shell intro-shell" id="introPage">
    <div class="card intro-card">
      <span class="badge">Một điều nhỏ xinh dành cho Tâm xinh gái</span>

      <img
        src="https://media.tenor.com/EBV7OT7ACfwAAAAj/u-u-qua-qua-u-quaa.gif"
        alt="Gif dễ thương"
        class="intro-gif"
      />

      <h2 class="intro-title">Anh có điều này muốn gửi em 💌</h2>
      <p class="intro-desc">
        Một lời chúc 8/3 nho nhỏ, dễ thương và chỉ dành riêng cho em.
      </p>

      <button id="startBtn" class="btn btn-primary" type="button">
        Mở ra nè 🌸
      </button>
    </div>
  </section>

  <main class="page-shell hidden" id="mainPage">
    <section class="card main-card">
      <span class="badge">8/3 dành cho người đặc biệt</span>

      <img
        src="https://media.tenor.com/eNHbizSfVb0AAAAj/lovemode-cute.gif"
        alt="Gif dễ thương"
        class="main-gif"
      />

      <h1 id="questionText" class="main-title">
        Em nhận lời chúc 8/3 của anh nhé? 🌷
      </h1>

      <p class="main-subtitle">Anh chuẩn bị dễ thương lắm đó 💙</p>

      <p class="helper-text">
        Bấm “YES” để nhận nhé, còn “NO” thì vẫn có thể đổi ý đó 😛😚
      </p>

      <div class="buttons-area" id="buttonsArea">
        <button id="yesBtn" class="btn btn-primary answer-btn" type="button">
          Yes
        </button>

        <button id="noBtn" class="btn btn-secondary answer-btn" type="button">
          No
        </button>
      </div>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
